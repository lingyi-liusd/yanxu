<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>续芽 · 项目工作台</title>
<link rel="icon" type="image/png" href="/assets/yanxu-logo.png">
<style>
:root {
  --rd-bg: #f5f5f7;
  --rd-sidebar: rgba(246, 246, 248, .92);
  --rd-list: #ffffff;
  --rd-inspector: #ffffff;
  --rd-text: #1d1d1f;
  --rd-secondary: #6e6e73;
  --rd-tertiary: #8e8e93;
  --rd-disabled: #aeaeb2;
  --rd-faint: rgba(60, 60, 67, .33);
  --rd-line: rgba(60, 60, 67, .10);
  --rd-line-soft: rgba(60, 60, 67, .075);
  --rd-selection: #f0f6ff;
  --rd-sidebar-selection: rgba(0, 0, 0, .045);
  --rd-hover: rgba(0, 0, 0, .045);
  --rd-accent: #0a84ff;
  --rd-blue: #0a84ff;
  --rd-green: #34c759;
  --rd-red: #ff453a;
  --rd-orange: #ff9f0a;
  --rd-purple: #af52de;
  --rd-pink: #ff375f;
  --rd-teal: #30b0c7;
  --rd-dialog: #ffffff;
}
:root[data-theme="dark"] {
  --rd-bg: #1c1c1e;
  --rd-sidebar: rgba(31, 31, 33, .96);
  --rd-list: #242426;
  --rd-inspector: #202023;
  --rd-text: rgba(255, 255, 255, .92);
  --rd-secondary: rgba(235, 235, 245, .66);
  --rd-tertiary: rgba(235, 235, 245, .43);
  --rd-disabled: rgba(235, 235, 245, .28);
  --rd-faint: rgba(235, 235, 245, .28);
  --rd-line: rgba(235, 235, 245, .14);
  --rd-line-soft: rgba(235, 235, 245, .08);
  --rd-selection: rgba(10, 132, 255, .18);
  --rd-sidebar-selection: rgba(118, 118, 128, .22);
  --rd-hover: rgba(255, 255, 255, .06);
  --rd-accent: #74a8ff;
  --rd-blue: #74a8ff;
  --rd-green: #65bd79;
  --rd-red: #ee7777;
  --rd-orange: #e8a14e;
  --rd-purple: #c58ae8;
  --rd-pink: #ff7b97;
  --rd-teal: #6bd1df;
  --rd-dialog: #2c2c2e;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  overflow: hidden;
  background: var(--rd-bg);
  color: var(--rd-text);
  font: 14px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "PingFang SC", "Helvetica Neue", sans-serif;
  letter-spacing: -.01em;
}
button, input, select, textarea { font: inherit; }
button { color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [role="button"]:focus-visible { outline: 2px solid var(--rd-accent); outline-offset: 2px; }
.rd-app { display: grid; grid-template-columns: 232px minmax(0, 1fr); height: 100vh; min-width: 900px; }
.rd-sidebar { display: flex; flex-direction: column; min-height: 0; padding: 18px 12px 14px; background: var(--rd-sidebar); border-right: 1px solid var(--rd-line); }
.rd-brand { display: flex; align-items: center; gap: 10px; min-height: 34px; padding: 0 8px 20px; }
.rd-brand-mark { display: grid; place-items: center; width: 42px; height: 42px; flex: 0 0 42px; overflow: hidden; border-radius: 11px; }
.rd-brand-mark img { display: block; width: 100%; height: 100%; object-fit: cover; }
.rd-brand-name { font-size: 16px; font-weight: 600; line-height: 1.1; }
.rd-brand-name small { display: block; margin-top: 3px; color: var(--rd-tertiary); font-size: 10px; font-weight: 500; letter-spacing: .08em; }
.rd-nav { display: grid; gap: 2px; }
.rd-nav-button, .rd-project-row, .rd-side-action { display: flex; align-items: center; width: 100%; min-height: 34px; border: 0; border-radius: 6px; background: transparent; text-align: left; }
.rd-nav-button { gap: 10px; padding: 6px 10px; color: var(--rd-secondary); }
.rd-nav-button:hover, .rd-project-row:hover, .rd-side-action:hover { background: var(--rd-hover); }
.rd-nav-button.is-active, .rd-project-row.is-active { background: var(--rd-sidebar-selection); color: var(--rd-text); }
.rd-nav-glyph { width: 18px; color: var(--rd-secondary); font-size: 15px; text-align: center; }
.rd-nav-button.is-active .rd-nav-glyph { color: var(--rd-text); }
.rd-command-hint { margin-left: auto; color: var(--rd-tertiary); font-size: 10px; }
.rd-side-heading { display: flex; align-items: center; justify-content: space-between; margin: 26px 6px 6px 10px; color: var(--rd-secondary); font-size: 12px; font-weight: 600; }
.rd-side-create { border: 0; border-radius: 5px; padding: 3px 6px; background: transparent; color: var(--rd-blue); font-size: 11px; font-weight: 500; }
.rd-side-create:hover { background: var(--rd-hover); }
.rd-icon-button { display: inline-grid; place-items: center; width: 30px; height: 30px; border: 0; border-radius: 6px; background: transparent; color: var(--rd-secondary); font-size: 17px; line-height: 1; }
.rd-icon-button:hover, .rd-tool-button:hover, .rd-row-more:hover { background: var(--rd-hover); color: var(--rd-text); }
.rd-projects { display: grid; gap: 1px; min-height: 0; overflow: auto; scrollbar-width: thin; }
.rd-project-row { gap: 9px; min-height: 36px; padding: 6px 9px; color: var(--rd-secondary); }
.rd-project-mark { width: 5px; height: 5px; flex: 0 0 auto; border-radius: 50%; background: var(--rd-faint); }
.rd-project-row.is-active .rd-project-mark { background: var(--rd-accent); }
.rd-project-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rd-side-badge { min-width: 16px; color: var(--rd-red); font-size: 11px; text-align: right; }
.rd-sidebar-spacer { flex: 1; min-height: 20px; }
.rd-side-footer { position: relative; display: grid; gap: 2px; padding-top: 12px; border-top: 1px solid var(--rd-line-soft); }
.rd-local-note { padding: 0 10px 7px; color: var(--rd-tertiary); font-size: 11px; }
.rd-side-action { min-height: 28px; padding: 5px 10px; color: var(--rd-secondary); font-size: 12px; }
.rd-side-action-tail { margin-left: auto; color: var(--rd-tertiary); letter-spacing: .08em; }
.rd-main { display: grid; grid-template-rows: auto auto minmax(0, 1fr); min-width: 0; min-height: 0; background: var(--rd-list); }
.rd-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; min-height: 102px; padding: 28px 28px 18px; background: var(--rd-list); }
.rd-header-context { max-width: min(720px, 70vw); min-width: 0; }
.rd-eyebrow { overflow: hidden; color: var(--rd-secondary); font-size: 12px; line-height: 1.3; text-overflow: ellipsis; white-space: nowrap; }
.rd-title { margin: 4px 0 3px; font-size: 29px; font-weight: 600; letter-spacing: -.035em; line-height: 1.12; }
.rd-subtitle { max-width: 720px; overflow: hidden; color: var(--rd-tertiary); font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
.rd-header-actions { display: flex; align-items: center; gap: 4px; padding-top: 1px; }
.rd-header-text-button, .rd-tool-button { border: 0; border-radius: 6px; background: transparent; color: var(--rd-secondary); }
.rd-header-text-button { padding: 7px 9px; font-size: 12px; }
.rd-header-text-button:hover { background: var(--rd-hover); color: var(--rd-text); }
.rd-toolbar { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; padding: 0 28px; border-bottom: 1px solid var(--rd-line); background: var(--rd-list); }
.rd-toolbar-left, .rd-toolbar-right { display: flex; align-items: center; gap: 3px; min-width: 0; }
.rd-tab { position: relative; min-height: 42px; border: 0; border-bottom: 2px solid transparent; padding: 0 10px; background: transparent; color: var(--rd-secondary); font-size: 13px; white-space: nowrap; }
.rd-tab:hover { color: var(--rd-text); }
.rd-tab.is-active { border-bottom-color: var(--rd-text); color: var(--rd-text); font-weight: 600; }
.rd-tab-count { margin-left: 3px; color: var(--rd-tertiary); font-size: 11px; font-weight: 400; }
.rd-tool-button { display: inline-flex; align-items: center; gap: 5px; min-height: 30px; padding: 5px 8px; font-size: 12px; }
.rd-tool-symbol { color: var(--rd-tertiary); font-size: 15px; line-height: 1; }
.rd-tool-menu { position: absolute; z-index: 20; top: 38px; right: 28px; width: 190px; padding: 5px; border: 1px solid var(--rd-line); border-radius: 10px; background: var(--rd-dialog); box-shadow: 0 12px 34px rgba(0, 0, 0, .14); }
.rd-tool-menu[hidden] { display: none; }
.rd-tool-menu button { display: block; width: 100%; border: 0; border-radius: 6px; padding: 7px 9px; background: transparent; color: var(--rd-text); text-align: left; font-size: 13px; }
.rd-tool-menu button:hover { background: var(--rd-hover); }
.rd-tool-menu .menu-caption { padding: 5px 9px 4px; color: var(--rd-tertiary); font-size: 11px; }
/* Footer menus open upward. Do not inherit the toolbar menu's top/width. */
.rd-tool-menu.rd-side-utility-menu { top: auto; right: 8px; bottom: 34px; left: 8px; width: auto; max-height: calc(100vh - 40px); overflow-y: auto; }
.rd-body { display: grid; grid-template-columns: minmax(500px, 1fr) 440px; min-height: 0; background: var(--rd-list); }
.rd-list-pane { min-width: 0; min-height: 0; overflow: auto; padding: 20px 28px 60px; background: var(--rd-list); scrollbar-width: thin; }
.rd-inspector { min-width: 0; min-height: 0; overflow: auto; padding: 26px 28px 48px; border-left: 1px solid var(--rd-line); background: var(--rd-inspector); scrollbar-width: thin; }
.rd-list-intro { display: flex; align-items: baseline; justify-content: space-between; gap: 14px; margin-bottom: 16px; }
.rd-list-intro h2 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -.02em; }
.rd-list-intro p { margin: 3px 0 0; color: var(--rd-tertiary); font-size: 12px; }
.rd-secondary-label { color: var(--rd-secondary); font-size: 12px; }
.rd-section { margin: 0 0 23px; }
.rd-section-heading { display: flex; align-items: baseline; gap: 8px; margin: 0 0 5px 4px; color: var(--rd-text); font-size: 13px; font-weight: 600; }
.rd-section-heading span { color: var(--rd-tertiary); font-size: 11px; font-weight: 400; }
.rd-task-row { position: relative; display: grid; grid-template-columns: 24px minmax(0, 1fr) 76px 24px; align-items: center; gap: 7px; min-height: 53px; border-radius: 6px; padding: 4px 6px; cursor: default; }
.rd-task-row::after { position: absolute; right: 0; bottom: 0; left: 38px; height: 1px; background: var(--rd-line-soft); content: ""; }
.rd-task-row:hover { background: var(--rd-hover); }
.rd-task-row.is-selected { background: var(--rd-selection); }
.rd-task-check { display: grid; place-items: center; width: 19px; height: 19px; margin-left: 2px; border: 1.5px solid var(--rd-tertiary); border-radius: 50%; background: transparent; color: var(--rd-list); font-size: 11px; line-height: 1; }
.rd-task-check:hover { border-color: var(--rd-text); }
.rd-task-check.is-done { border-color: var(--rd-green); background: var(--rd-green); color: #fff; }
.rd-task-copy { min-width: 0; }
.rd-task-title { display: block; overflow: hidden; color: var(--rd-text); font-size: 14px; font-weight: 500; line-height: 1.4; text-overflow: ellipsis; white-space: nowrap; }
.rd-task-title.is-done { color: var(--rd-tertiary); text-decoration: line-through; }
.rd-task-meta { display: block; overflow: hidden; margin-top: 2px; color: var(--rd-tertiary); font-size: 11px; line-height: 1.25; text-overflow: ellipsis; white-space: nowrap; }
.rd-priority-mark { display: inline-block; margin-right: 5px; color: var(--rd-red); font-size: 11px; font-weight: 600; }
.rd-task-date { color: var(--rd-tertiary); font-size: 12px; text-align: right; white-space: nowrap; }
.rd-task-date.is-alert, .rd-task-date.is-today { color: var(--rd-red); }
.rd-row-more { display: inline-grid; place-items: center; width: 24px; height: 24px; border: 0; border-radius: 5px; background: transparent; color: var(--rd-faint); font-size: 16px; letter-spacing: .08em; opacity: 0; }
.rd-task-row:hover .rd-row-more, .rd-task-row.is-selected .rd-row-more, .rd-row-more:focus-visible { opacity: 1; }
.rd-empty { padding: 54px 20px; color: var(--rd-tertiary); text-align: center; }
.rd-empty strong { display: block; margin-bottom: 5px; color: var(--rd-secondary); font-size: 14px; font-weight: 500; }
.rd-empty button, .rd-inline-link { border: 0; padding: 0; background: transparent; color: var(--rd-accent); font-size: 12px; }
.rd-project-list { border-top: 1px solid var(--rd-line); }
.rd-project-list-row { display: grid; grid-template-columns: minmax(0, 1fr) 100px 68px; align-items: center; gap: 14px; min-height: 64px; border-bottom: 1px solid var(--rd-line-soft); padding: 7px 8px; cursor: pointer; }
.rd-project-list-row:hover { background: var(--rd-hover); }
.rd-project-list-name { overflow: hidden; font-size: 14px; font-weight: 500; text-overflow: ellipsis; white-space: nowrap; }
.rd-project-list-goal { overflow: hidden; margin-top: 2px; color: var(--rd-tertiary); font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
.rd-project-list-meta { color: var(--rd-secondary); font-size: 12px; text-align: right; white-space: nowrap; }
.rd-project-list-date { color: var(--rd-tertiary); font-size: 11px; text-align: right; }
.rd-inline-meter { width: 100%; height: 2px; margin-top: 6px; background: var(--rd-line-soft); }
.rd-inline-meter i { display: block; height: 100%; background: var(--rd-secondary); }
.rd-inspector-empty { display: grid; align-content: center; min-height: 100%; padding: 0 28px; color: var(--rd-tertiary); text-align: center; }
.rd-inspector-empty strong { display: block; margin-bottom: 6px; color: var(--rd-secondary); font-size: 15px; font-weight: 500; }
.rd-inspector-kicker { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.rd-inspector-check { display: grid; place-items: center; width: 22px; height: 22px; border: 1.5px solid var(--rd-tertiary); border-radius: 50%; background: transparent; color: var(--rd-inspector); font-size: 12px; }
.rd-inspector-check.is-done { border-color: var(--rd-green); background: var(--rd-green); color: #fff; }
.rd-inspector-actions { display: flex; gap: 2px; }
.rd-inspector-title { margin: 0; font-size: 21px; font-weight: 600; letter-spacing: -.025em; line-height: 1.25; }
.rd-inspector-project { margin-top: 5px; color: var(--rd-tertiary); font-size: 11px; }
.rd-inspector-description { margin: 16px 0 24px; color: var(--rd-secondary); font-size: 13px; line-height: 1.55; white-space: pre-line; }
.rd-property-list { border-top: 1px solid var(--rd-line); }
.rd-property-row { display: grid; grid-template-columns: 94px minmax(0, 1fr); align-items: center; min-height: 37px; border-bottom: 1px solid var(--rd-line-soft); font-size: 12px; }
.rd-property-label { color: var(--rd-secondary); }
.rd-property-value { min-width: 0; overflow: hidden; border: 0; padding: 0; background: transparent; color: var(--rd-text); text-align: left; text-overflow: ellipsis; white-space: nowrap; }
.rd-property-value:hover { color: var(--rd-accent); }
.rd-status-line { display: inline-flex; align-items: center; gap: 6px; }
.rd-status-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--rd-tertiary); }
.rd-status-dot.is-live, .rd-status-dot.is-done { background: var(--rd-green); }
.rd-status-dot.is-blocked { background: var(--rd-orange); }
.rd-tags { display: flex; flex-wrap: wrap; gap: 5px; }
.rd-tag { display: inline-block; border-radius: 6px; padding: 2px 6px; background: var(--rd-line-soft); color: var(--rd-secondary); font-size: 11px; }
.rd-inspector-section { margin-top: 28px; }
.rd-section-topline { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 9px; }
.rd-section-topline h3 { margin: 0; font-size: 13px; font-weight: 600; }
.rd-section-topline span { color: var(--rd-tertiary); font-size: 11px; }
.rd-progress-track { height: 2px; margin: 0 0 11px; background: var(--rd-line); }
.rd-progress-track i { display: block; height: 100%; background: var(--rd-secondary); }
.rd-checklist { display: grid; gap: 0; }
.rd-checklist-row { display: flex; align-items: flex-start; gap: 8px; min-height: 31px; padding: 4px 0; color: var(--rd-secondary); font-size: 12px; }
.rd-checklist-row .rd-mini-check { flex: 0 0 auto; width: 14px; height: 14px; margin-top: 1px; border: 1px solid var(--rd-tertiary); border-radius: 3px; color: #fff; font-size: 9px; text-align: center; }
.rd-checklist-row.is-done .rd-mini-check { border-color: var(--rd-green); background: var(--rd-green); }
.rd-checklist-row.is-done span:last-child { color: var(--rd-tertiary); text-decoration: line-through; }
.rd-files { display: grid; }
.rd-file-row { display: grid; grid-template-columns: 18px minmax(0, 1fr) 24px; align-items: center; gap: 7px; min-height: 39px; border-bottom: 1px solid var(--rd-line-soft); color: var(--rd-secondary); }
.rd-file-symbol { color: var(--rd-tertiary); font-size: 15px; }
.rd-file-name { display: block; overflow: hidden; color: var(--rd-text); font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
.rd-file-meta { display: block; overflow: hidden; color: var(--rd-tertiary); font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
.rd-notes { min-height: 54px; border-top: 1px solid var(--rd-line); padding-top: 12px; color: var(--rd-tertiary); font-size: 12px; }
.rd-notes button { border: 0; padding: 0; background: transparent; color: inherit; text-align: left; }
.rd-notes button:hover { color: var(--rd-text); }
.rd-note-editor { display: grid; gap: 8px; }
.rd-note-editor textarea { width: 100%; min-height: 88px; resize: vertical; border: 1px solid var(--rd-line); border-radius: 6px; padding: 8px; outline: 0; background: var(--rd-list); color: var(--rd-text); font-size: 12px; }
.rd-note-actions { display: flex; gap: 8px; }
.rd-note-actions button { border: 0; background: transparent; color: var(--rd-secondary); font-size: 12px; }
.rd-note-actions button:first-child { color: var(--rd-accent); }
.rd-board { display: grid; grid-template-columns: repeat(4, minmax(150px, 1fr)); min-width: 760px; border-top: 1px solid var(--rd-line); }
.rd-board-column { min-height: 400px; padding: 12px 12px 28px; border-right: 1px solid var(--rd-line-soft); }
.rd-board-column:last-child { border-right: 0; }
.rd-board-heading { display: flex; justify-content: space-between; margin-bottom: 9px; color: var(--rd-secondary); font-size: 12px; font-weight: 600; }
.rd-board-task { border-bottom: 1px solid var(--rd-line-soft); padding: 10px 4px; cursor: pointer; }
.rd-board-task:hover { background: var(--rd-hover); }
.rd-board-task strong { display: block; font-size: 13px; font-weight: 500; line-height: 1.4; }
.rd-board-task small { display: block; margin-top: 4px; color: var(--rd-tertiary); font-size: 11px; }
.rd-flow { border-top: 1px solid var(--rd-line); }
.rd-flow-row { display: grid; grid-template-columns: 25px 170px minmax(0, 1fr) 45px; align-items: center; gap: 12px; min-height: 54px; border-bottom: 1px solid var(--rd-line-soft); }
.rd-flow-index { color: var(--rd-tertiary); font-size: 11px; text-align: center; }
.rd-flow-name { font-size: 13px; font-weight: 500; }
.rd-flow-summary { color: var(--rd-tertiary); font-size: 11px; }
.rd-flow-pct { color: var(--rd-secondary); font-size: 11px; text-align: right; }
.rd-gantt { min-width: 680px; border-top: 1px solid var(--rd-line); }
.rd-gantt-head, .rd-gantt-row { display: grid; grid-template-columns: 260px minmax(380px, 1fr); align-items: center; min-height: 43px; border-bottom: 1px solid var(--rd-line-soft); }
.rd-gantt-head { color: var(--rd-tertiary); font-size: 11px; }
.rd-gantt-label { overflow: hidden; padding: 0 8px; text-overflow: ellipsis; white-space: nowrap; }
.rd-gantt-track { position: relative; height: 100%; background: repeating-linear-gradient(90deg, transparent, transparent calc(20% - 1px), var(--rd-line-soft) calc(20% - 1px), var(--rd-line-soft) 20%); }
.rd-gantt-bar { position: absolute; top: 13px; height: 17px; min-width: 8px; border-radius: 3px; background: var(--rd-secondary); }
.rd-gantt-bar.is-done { background: var(--rd-green); }
.rd-gantt-bar.is-blocked { background: var(--rd-orange); }
.rd-gantt-ticks { display: flex; justify-content: space-between; padding: 0 8px; }
.rd-file-view, .rd-decision-view { border-top: 1px solid var(--rd-line); }
.rd-file-view-row, .rd-decision-row { display: grid; grid-template-columns: minmax(0, 1fr) 120px 60px; align-items: center; gap: 14px; min-height: 58px; border-bottom: 1px solid var(--rd-line-soft); padding: 7px 8px; }
.rd-file-view-row:hover, .rd-decision-row:hover { background: var(--rd-hover); }
.rd-file-view-row strong, .rd-decision-row strong { display: block; font-size: 13px; font-weight: 500; }
.rd-file-view-row small, .rd-decision-row small { display: block; margin-top: 3px; color: var(--rd-tertiary); font-size: 11px; }
.rd-file-view-meta { color: var(--rd-tertiary); font-size: 11px; text-align: right; }
.rd-danger { color: var(--rd-red) !important; }
dialog { width: min(560px, calc(100vw - 32px)); max-height: min(760px, calc(100vh - 32px)); border: 1px solid var(--rd-line); border-radius: 12px; padding: 0; background: var(--rd-dialog); color: var(--rd-text); box-shadow: 0 20px 70px rgba(0, 0, 0, .24); }
dialog::backdrop { background: rgba(0, 0, 0, .26); }
.rd-dialog-form { padding: 24px; overflow: auto; }
.rd-dialog-title { margin: 0 0 4px; font-size: 19px; font-weight: 600; }

function rdTranslateUI(source, locale) {
  if(locale!=='en')return source;

  if(Object.prototype.hasOwnProperty.call(rdEnglish,key))return leading+rdEnglish[key]+trailing;

  if(/^[A-Za-z0-9._:/-]+ · 当前接口推荐$/.test(key))return leading+key.replace(' · 当前接口推荐',' · Recommended by this interface')+trailing;
  let match=key.match(/^(\d+)\s*项$/); if(match)return match[1]+' items';
  match=key.match(/^核查批次回包 (\d+) \/ (\d+)$/);if(match)return 'Review batch responses '+match[1]+' / '+match[2];
  match=key.match(/^更早的只读核查 · (\d+)$/);if(match)return 'Earlier read-only reviews · '+match[1];
  match=key.match(/^· (已完成|未完成|处理中|待处理)$/);if(match)return '· '+rdEnglish[match[1]];
  match=key.match(/^登记记录将分 (\d+) 批处理，再合并为一份总结。每批及汇总均计入模型用量，全部完成前不生成行动建议。$/);if(match)return 'Registered records will be processed in '+match[1]+' batches, then aggregated. Every batch and aggregation counts toward model usage. No action suggestion is created until all steps finish.';
  match=key.match(/^分批回包 (\d+) \/ (\d+) · 总摘要尚未完成$/);if(match)return 'Batch responses '+match[1]+' / '+match[2]+' · Final summary is not complete';
  match=key.match(/^已尝试 (\d+) 次调用 · 回包不等于理解或核验$/);if(match)return match[1]+' call attempts · A response is not understanding or verification';
  match=key.match(/^已索引 (\d+) · 已处理 (\d+) · 待处理 (\d+)$/);if(match)return 'Indexed '+match[1]+' · Processed '+match[2]+' · Pending '+match[3];

  match=key.match(/^(软件检查|来源检查|科学审查记录) · (已接受，仅所列判据|未接受|还需补充)$/);if(match)return ({'软件检查':'Software check','来源检查':'Source check','科学审查记录':'Scientific review record'}[match[1]])+' · '+({'已接受，仅所列判据':'Accepted within listed criteria only','未接受':'Not accepted','还需补充':'More needed'}[match[2]]);

  const labels='.rd-closure-label,.rd-nav-button,.rd-side-heading,.rd-side-footer,#title,#subtitle,.rd-header-actions,#toolbar button,.rd-os-section-head,.rd-os-disclosure>summary,.rd-dialog-title,.rd-form-label,.rd-dialog-actions button,.rd-os-empty,.rd-swim-intro,.rd-swim-column,.rd-swim-label,.rd-swim-card>small,.rd-swim-card>span,.rd-swim-card>em,.rd-swim-history>summary,.rd-result-legend,.rd-result-root,.rd-artifact-root,.rd-cal-switch button,.rd-cal-weekdays,.rd-timeline-controls button,.rd-delivery-pulse,.rd-change-chain small,.rd-change-chain strong,.rd-change-note,.rd-os-headline-label,.rd-os-hero-next>span,.rd-change-entry,.rd-os-tree>details>summary>small,.rd-result-group>summary>small,.rd-os-journey-node>small,.rd-readable-text>summary>small,.rd-os-inspector-section>h3,button[data-ai-action],button[data-os-view],.rd-os-continuity>p,.rd-os-continuity summary,.rd-os-livebar,.rd-os-analysis>summary,.rd-intake-entry,.rd-library-search,.rd-library-tree h3,.rd-plan-note,#form>h2,#form label,#form button,.rd-note-tabs button,.rd-tool-menu button';
  const protectedSelector='input,textarea,pre,code,option,#projects,.rd-brand,.rd-os-project-name,.rd-os-headline,.rd-state-leaves,.rd-os-tree-row strong,.rd-swim-owner,.rd-swim-card strong,.rd-lane-head strong,[data-preserve-original]';
  function update(){
    document.documentElement.lang=locale;
    document.querySelectorAll(labels+',.rd-note-nav-head,.rd-note-nav-section-title,.rd-note-nav-more>summary,.rd-note-nav-label,.rd-note-center-inner h2:not(.rd-note-reader-title),.rd-note-center-inner h3,.rd-note-context-head,.rd-note-context-section-head,.rd-note-context-empty,.rd-note-context-note,.rd-note-center button:not([data-note-record]),.rd-note-center .rd-note-section-head,.rd-note-health-row>span,.rd-note-health-caption,.rd-note-pipeline-row>span,.rd-note-context-next>small,.rd-note-context-next>button').forEach(function(el){
      const walker=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);let node;
      while((node=walker.nextNode())){
        if((node.parentElement.closest(protectedSelector+',.rd-note-reader-title,.rd-note-reader-body,[data-note-record] strong,.rd-note-context-record strong,.rd-note-nav-button[data-note-section="topic"]') && !node.parentElement.matches('option.rd-closure-label')) || rdIsOriginalHeader(node.parentElement,typeof aiView==='undefined'?'':aiView))continue;
        const previous=originals.get(node), current=node.nodeValue;
        const original=previous && current===previous.translated?previous.original:current;
        const translated=rdTranslateUI(original,locale);originals.set(node,{original:original,translated:translated});
        if(current!==translated)node.nodeValue=translated;
      }
    });
    document.querySelectorAll('.rd-nav-button,.rd-side-footer button,#toolbar button,#toolbar select,.rd-delivery-pulse,input[placeholder],textarea[placeholder],.rd-ai-batch-progress progress').forEach(function(el){
      ['aria-label','title','placeholder'].forEach(function(key){const current=el.getAttribute(key);if(current===null)return;const records=attrs.get(el)||{},prev=records[key],original=prev && current===prev.translated?prev.original:current,translated=rdTranslateUI(original,locale);records[key]={original:original,translated:translated};attrs.set(el,records);if(current!==translated)el.setAttribute(key,translated);});
    });
    const button=document.getElementById('rdLanguageSwitch');if(button){button.textContent=locale==='en'?'中文':'English';button.setAttribute('aria-label',locale==='en'?'Switch to Chinese':'切换为英语');}
  }
  const button=document.createElement('button');button.id='rdLanguageSwitch';button.type='button';button.className='rd-language-switch';
  button.addEventListener('click',function(){locale=locale==='en'?'zh-CN':'en';try{localStorage.setItem('yanxu-ui-language',locale);}catch(e){}update();const selected=locale;languageSave=languageSave.then(function(){return api('ui/preferences',{language:selected});}).catch(function(){toast('语言已切换，但保存失败；重开前请重新确认。');});});
  document.querySelector('.rd-header-actions').prepend(button);
  let queued=false;const observer=new MutationObserver(function(){if(queued)return;queued=true;queueMicrotask(function(){queued=false;observer.disconnect();update();observer.observe(document.body,{subtree:true,childList:true,characterData:true});});});
  update();observer.observe(document.body,{subtree:true,childList:true,characterData:true});
})();
</script>
